name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # The CommonLibSSE-NG build is what makes a cold run slow; keep it warm.
      - name: Cache xmake packages and build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake
            build
          key: commonlib-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake-requires.lock', 'lib/commonlibsse-ng/xmake.lua') }}
          restore-keys: |
            commonlib-${{ runner.os }}-

      - name: Fetch prebuilt dependencies
        shell: powershell
        run: ./scripts/fetch-deps.ps1 -SkipModel

      # CommonLibSSE-NG's prebuilt archive is baked for a different CRT and does
      # not link against this project's static CRT; unset GITHUB_ACTIONS so the
      # submodule is built from source with the project's own config.
      - name: Configure
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake f -m release -y -a x64

      - name: Build
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake -y -v

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AudioUtilTTS-dll
          path: build/windows/x64/release/AudioUtilTTS.dll
          if-no-files-found: error
