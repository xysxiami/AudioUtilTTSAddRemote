name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # The CommonLibSSE-NG build is what makes a cold run slow; keep it warm.
      - name: Cache xmake packages and build tree
        uses: actions/cache@v4
        with:
          path: |
            ~/.xmake
            build
          key: commonlib-${{ runner.os }}-${{ hashFiles('xmake.lua', 'xmake-requires.lock', 'lib/commonlibsse-ng/xmake.lua') }}
          restore-keys: |
            commonlib-${{ runner.os }}-

      - name: Fetch prebuilt dependencies
        shell: powershell
        run: ./scripts/fetch-deps.ps1 -SkipModel

      # CommonLibSSE-NG's prebuilt archive is baked for a different CRT and does
      # not link against this project's static CRT; unset GITHUB_ACTIONS so the
      # submodule is built from source with the project's own config.
      - name: Configure
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake f -m release -y -a x64 2>&1 | Tee-Object -FilePath build-log.txt

      - name: Build
        shell: pwsh
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake -y -v 2>&1 | Tee-Object -FilePath build-log.txt -Append

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AudioUtilTTS-dll
          path: build/windows/x64/release/AudioUtilTTS.dll
          if-no-files-found: warn

      # 私有仓库用不了匿名产物下载：把 DLL 和构建日志提交回仓库，
      # 本地直接 git fetch 就能拿到。[skip ci] 防止再次触发构建。
      - name: Publish DLL to repo
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item build-log.txt artifacts/build-log.txt -Force -ErrorAction SilentlyContinue
          Copy-Item build/windows/x64/release/AudioUtilTTS.dll artifacts/AudioUtilTTS.dll -Force -ErrorAction SilentlyContinue
          "publish at $(Get-Date -Format o)" | Out-File artifacts/last-run.txt -Encoding utf8
          git status --short | Out-File artifacts/last-run.txt -Append -Encoding utf8
          git config user.name "ci"
          git config user.email "ci@local"
          git add artifacts
          git commit -m "ci: dll + log [skip ci]" 2>$null
          if ($LASTEXITCODE -eq 0) { git push origin HEAD:main }
